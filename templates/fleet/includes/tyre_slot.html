{% comment %}
  Single tyre position chip. Expects: slot, vehicle.
  Mounted = green chip (opens the tyre modal). Vacant = grey dashed chip (links to Mount form).
{% endcomment %}
{% if slot.is_mounted %}
<button type="button"
        class="group relative flex h-16 w-11 sm:w-12 shrink-0 flex-col justify-between overflow-hidden rounded-md border border-emerald-300 bg-emerald-50 px-1 py-1 text-center shadow-sm transition hover:border-emerald-500 hover:bg-emerald-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
        onclick="openTyreModal({
            id: '{{ slot.tyre.pk }}',
            position: '{{ slot.code|escapejs }} - {{ slot.name|escapejs }}',
            brand: '{{ slot.tyre.brand|escapejs }}',
            size: '{{ slot.tyre.size|default:"-"|escapejs }}',
            serialNumber: '{{ slot.tyre.serial_number|escapejs }}',
            purchaseCost: '{{ slot.tyre.purchase_cost|floatformat:2|escapejs }}',
            purchaseDate: '{{ slot.tyre.purchase_date|date:"d M Y"|default:"-"|escapejs }}',
            vendor: '{{ slot.tyre.vendor.name|default:"-"|escapejs }}',
            detailUrl: '{% url 'tyre-detail' slot.tyre.pk %}',
            rotateUrl: '{% url 'tyre-log-create' %}?action=Rotation&tyre={{ slot.tyre.pk }}',
            dismountUrl: '{% url 'tyre-action' slot.tyre.pk 'Dismount' %}'
        })"
        title="{{ slot.name }} ({{ slot.code }}) &middot; {{ slot.tyre.brand }} #{{ slot.tyre.serial_number }} &mdash; click for actions">
    <span class="flex items-center justify-between">
        <span class="text-[9px] font-black uppercase leading-none tracking-wide text-emerald-800">{{ slot.code }}</span>
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
    </span>
    <span class="min-w-0">
        <span class="block truncate text-[10px] font-bold leading-tight text-slate-800">{{ slot.tyre.brand }}</span>
        <span class="block truncate font-mono text-[8px] leading-none text-slate-500">#{{ slot.tyre.serial_number|slice:"-5:" }}</span>
    </span>
</button>
{% else %}
<a href="{% url 'tyre-log-create' %}?action=Mount&vehicle={{ vehicle.pk }}&position={{ slot.code }}"
   class="group flex h-16 w-11 sm:w-12 shrink-0 flex-col items-center justify-between rounded-md border border-dashed border-slate-300 bg-white px-1 py-1 text-slate-400 transition hover:border-emerald-500 hover:bg-emerald-50 hover:text-emerald-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
   title="Vacant: {{ slot.name }} ({{ slot.code }}) &mdash; click to mount a tyre">
    <span class="self-start text-[9px] font-black uppercase leading-none tracking-wide">{{ slot.code }}</span>
    <i class="fa-solid fa-plus text-xs"></i>
    <span class="text-[8px] font-semibold uppercase leading-none">Vacant</span>
</a>
{% endif %}
