<div class="text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-50 rounded-full mb-3 text-slate-300">
        <i class="{{ icon|default:'fa-regular fa-folder-open' }} text-2xl"></i>
    </div>
    <h3 class="text-base font-bold text-slate-800">{{ title|default:'No records found' }}</h3>
    {% if description %}
    <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">{{ description }}</p>
    {% endif %}
    {% if action_url and action_text %}
    <div class="mt-4">
        <a href="{{ action_url }}" class="inline-flex items-center px-4 py-2 bg-emerald-600 text-white rounded-md text-xs font-bold hover:bg-emerald-700 shadow-sm transition-colors uppercase tracking-tight">
            <i class="{{ action_icon|default:'fa-solid fa-plus' }} mr-1.5"></i>{{ action_text }}
        </a>
    </div>
    {% endif %}
</div>
