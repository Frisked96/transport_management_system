<div class="flex items-center justify-between pt-6 border-t border-slate-100 mt-8 sticky bottom-16 z-30 bg-white py-3 px-4 -mx-4 md:relative md:bottom-auto md:z-auto md:bg-transparent md:border-t md:border-slate-100 md:py-0 md:px-0 md:mx-0 md:pt-6 md:mt-8">
    <div>
        {% if delete_url %}
        <a href="{{ delete_url }}" class="inline-flex items-center px-4 py-2 border border-rose-200 rounded-md text-rose-700 bg-rose-50 hover:bg-rose-100 text-sm font-medium transition-colors">
            <i class="fa-regular fa-trash-can mr-2"></i>Delete
        </a>
        {% endif %}
    </div>
    <div class="flex items-center space-x-3">
        <a href="{{ cancel_url }}" class="px-5 py-2 border border-slate-300 rounded-md text-slate-700 bg-white hover:bg-slate-50 text-sm font-medium transition-colors">
            Cancel
        </a>
        <button type="submit" class="px-6 py-2 bg-emerald-600 text-white rounded-md text-sm font-medium hover:bg-emerald-700 shadow-sm transition-colors inline-flex items-center">
            <i class="{{ submit_icon|default:'fa-solid fa-check' }} mr-2"></i>
            <span>{{ submit_text|default:'Save Changes' }}</span>
        </button>
    </div>
</div>
