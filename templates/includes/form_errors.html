{% if form.non_field_errors %}
<div class="mb-6 bg-rose-50 border-l-4 border-rose-500 p-4 rounded-md shadow-xs">
    <div class="flex">
        <div class="flex-shrink-0">
            <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
        </div>
        <div class="ml-3">
            <h3 class="text-sm font-bold text-rose-800">Please correct the following errors:</h3>
            <ul class="mt-1 text-sm text-rose-700 list-disc list-inside space-y-0.5">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endif %}
